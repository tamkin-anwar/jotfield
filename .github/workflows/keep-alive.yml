name: Keep Supabase awake

# Supabase's free plan pauses a project after about a week without database
# activity, which takes sync and sharing offline. One small read every three
# days counts as activity. Every table is closed to anon, so this calls the one
# public read-only function with an id that matches nothing. Not needed once
# the project is on a paid plan.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"share_id":"00000000-0000-0000-0000-000000000000"}' \
            "$SUPABASE_URL/rest/v1/rpc/read_note_share"
